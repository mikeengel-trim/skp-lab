<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Component Table</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.habitat.sketchup.com/dist/sketchup-js-api/v2/sketchup-js-api.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="title-block">
      <h1>Component Table</h1>
      <p>Every component in the model, grouped by your chosen attribute.</p>
    </div>
    <span class="live-indicator" id="live-indicator" hidden><span class="live-dot"></span>Live</span>
    <span class="status-pill" id="status-pill">Connecting…</span>
    <button class="btn-icon" id="refresh-btn" title="Re-read the model now" disabled>⟳</button>
  </header>

  <div class="banner banner-error" id="error-banner" hidden>
    <span class="banner-text" id="error-banner-text"></span>
    <span class="banner-close" id="error-banner-close">✕</span>
  </div>
  <div class="banner banner-warn" id="truncated-banner" hidden>
    <span class="banner-text" id="truncated-banner-text"></span>
    <span class="banner-close" id="truncated-banner-close">✕</span>
  </div>

  <div class="toolbar">
    <div class="toolbar-group">
      <span class="toolbar-label">Columns</span>
      <div class="chip-list" id="columns-list"></div>
      <select id="add-column-select">
        <option value="">+ Add column…</option>
      </select>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-group filters-group">
      <span class="toolbar-label">Filters</span>
      <div class="filter-rows" id="filters-list"></div>
      <div class="filters-actions">
        <button class="btn-add" id="add-filter-btn">+ Add filter</button>
        <button class="btn-link" id="clear-filters-btn" disabled>Clear all</button>
        <span class="filters-summary" id="filters-summary"></span>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-group">
      <span class="toolbar-label">Grouping</span>
      <label class="toolbar-inline-label">
        Group by
        <select id="group-by-field-select"></select>
      </label>
      <label class="toolbar-checkbox">
        <input type="checkbox" id="group-by-definition-toggle">
        <span id="group-by-definition-label">Tag → Definition Name</span>
      </label>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-group saved-configs-group">
      <span class="toolbar-label">Saved Tables</span>
      <select id="saved-configs-select">
        <option value="">No saved tables yet</option>
      </select>
      <button class="btn-link" id="rename-config-btn" disabled>Rename</button>
      <button class="btn-link" id="delete-config-btn" disabled>Delete</button>
      <button class="btn-add" id="save-config-btn">+ Save table as…</button>
      <div class="saved-config-inline" id="saved-config-inline" hidden></div>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-group calculated-columns-group">
      <span class="toolbar-label">Calculated Columns</span>
      <div class="chip-list" id="calculated-columns-list"></div>
      <button class="btn-add" id="add-calculated-column-btn">+ Add calculated column…</button>
      <div class="calculated-column-inline" id="calculated-column-inline" hidden></div>
    </div>
  </div>

  <div class="table-wrapper" id="table-wrapper">
    <table id="component-table">
      <thead id="component-table-head"></thead>
      <tbody id="component-table-body"></tbody>
    </table>
    <div class="empty-state" id="empty-state" hidden>No components match the current filters.</div>
  </div>

  <footer class="app-footer" id="footer-summary">—</footer>

  <script type="module" src="app.js"></script>
</body>
</html>
